name: Monthly summary (cloud)

on:
  # Kich hoat qua cron-job.org (08:00 sang ngay 1 gio VN) de tin cay hon lich GitHub.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trading-monthly
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      NOTIFIER_CHANNEL: email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai thu vien
        run: pip install -r requirements-cloud.txt
      - name: Gui mail tong ket thang
        run: python cloud_monthly_summary.py
