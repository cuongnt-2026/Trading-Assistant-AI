name: Weekly summary (cloud)

on:
  schedule:
    # 16:00 UTC thu 6 = 23:00 thu 6 gio VN. Tong ket tuan (mail, khong quet - khong ton token).
    - cron: "0 16 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: trading-weekly
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      NOTIFIER_CHANNEL: email
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai thu vien
        run: pip install -r requirements-cloud.txt
      - name: Gui mail tong ket tuan
        run: python cloud_weekly_summary.py
