name: Trading signals (cloud)

on:
  schedule:
    # Gio UTC (VN = UTC+7). Chi chay 09:00 -> 00:00 gio VN cho tiet kiem API.
    - cron: "*/15 2-16 * * 1-5"   # 09:00 - 23:45 VN, moi 15 phut, CHI thu 2-6
    - cron: "0 17 * * 1-5"        # 00:00 VN, CHI thu 2-6
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Gui 1 mail THU de kiem tra (khong quet tin hieu)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      NOTIFIER_CHANNEL: email
      FORCE_TEST_MAIL: ${{ inputs.test_mail }}
      # Danh sach da chot: XAU (breakout, M30+H1) + FX trend (M30)
      SYMBOLS_GOLD_CRYPTO: XAUUSD
      TIMEFRAMES_GOLD_CRYPTO: M15,M30,H1
      SYMBOLS_FOREX: EURUSD,USDJPY,NZDUSD
      TIMEFRAMES_FOREX: M30
      MIN_CONFIDENCE: "60"
      TREND_ENABLED: "0"
      SUPERTREND_TFS: "M30"
      SUPERTREND_RR: "3"
      ENTRY_MODE: limit
      USE_MTF: "1"
      CANDLE_COUNT: "250"
      # Bollinger Mean Reversion + London Breakout: tin hieu roi rac, quet doc lap
      # (khong thuoc watchlist tren) - cap/khung da chot qua backtest (PF > 1).
      BOLLINGER_ENABLED: "1"
      BOLLINGER_PAIRS: "EURUSD:H4,USDJPY:H4,EURUSD:M15"
      LONDON_ENABLED: "1"
      LONDON_PAIRS: "EURUSD:M30,EURUSD:H1,USDJPY:H1"
      # EMA Cross Watch: CANH BAO rieng (KHONG phai chien luoc vao lenh, khong SL/TP) -
      # theo doi EMA20/EMA100 tren XAU + 3 cap FX chinh, ca 3 khung M15/M30/H1, bao mail
      # khi SAP hoac VUA cat cheo nhau (xem src/signal/ema_cross_watcher.py).
      EMACROSS_ENABLED: "1"
      EMACROSS_PAIRS: "XAUUSD:M15,XAUUSD:M30,XAUUSD:H1,EURUSD:M15,EURUSD:M30,EURUSD:H1,GBPUSD:M15,GBPUSD:M30,GBPUSD:H1,USDJPY:M15,USDJPY:M30,USDJPY:H1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cai thu vien
        run: pip install -r requirements-cloud.txt
      - name: Quet tin hieu + gui mail
        run: python run_cloud.py
      - name: Luu trang thai (chong gui trung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A || true
          if git diff --staged --quiet; then echo "Khong co thay doi de luu"; exit 0; fi
          git commit -m "update signal state [skip ci]"
          git pull --rebase -X ours origin main || true
          git push && echo "PUSH OK" || echo "PUSH FAIL - vao Settings > Actions > General > Workflow permissions = Read and write"
